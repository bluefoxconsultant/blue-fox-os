# Anaconda profile configuration for Blue Fox OS.
#
# Overlaid by scripts/inject-anaconda-product.sh into the stage2 squashfs
# at /usr/share/anaconda/profile.d/blue-fox-os.conf. Selected at boot via
# inst.profile=blue-fox-os in scripts/brand-iso.sh.
#
# Format reference: rhinstaller/anaconda data/profile.d/fedora-kinoite.conf
# (Anaconda 41+). The Blue Fox profile derives from fedora-kinoite since
# our base is ostree Kinoite — we only override the user-visible chrome.

[Profile]
profile_id = blue-fox-os
base_profile = fedora-kinoite

[Profile Detection]
# Auto-select when the host /etc/os-release matches our brand. The boot
# param inst.profile=blue-fox-os remains the explicit selector.
os_id = blue-fox-os

[User Interface]
# Custom stylesheet replaces the Fedora sidebar (#22418) and brings the
# accent palette in line with BF brand canonical (#29ABE1 accent, #2D3031
# anthracite). The stylesheet path resolves inside stage2.
custom_stylesheet = /usr/share/anaconda/pixmaps/blue-fox-os.css
