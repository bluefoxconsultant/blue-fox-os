name: Validate Blue Fox OS

# Ce workflow ne construit PLUS d'images OCI (2026-07-16).
#
# Build + push + signature cosign + SBOM + attestation se font desormais en
# local, sur la machine de build, via `make publish SLUG=<tenant>`
# (scripts/publish-image.sh) — au meme endroit que l'assemblage de l'ISO.
# Ce qui reste ici est de la validation pure : lint kickstart, schema des
# manifests tenant, tests du welcome agent, build du RPM, plus un controle
# quotidien de la chaine de confiance sur les images deja publiees.
#
# Consequence assumee du retrait du rebuild quotidien : les mises a jour
# upstream de Fedora n'atterrissent plus dans :latest toutes seules. C'est
# `make publish` qui les ramasse, quand il est lance.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Ne reconstruit rien : seul verify-published tourne sur ce cron, pour
    # detecter qu'une image publiee perd sa signature (cle rotee, push non
    # signe). Les lanes de validation se rejouent sur push/PR, pas ici.
    - cron: '0 4 * * *'

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}

jobs:
  # Les 4 lanes de validation ne tournent pas sur le cron : le commit n'a pas
  # bouge depuis le dernier push, les rejouer chaque nuit ne prouve rien.
  validate-kickstart:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render bib-config.toml from kickstart (drift check)
        # render_bib_config.py rewrites install/bib-config.toml from
        # install/bf-os.ks. If the committed bib-config.toml differs from the
        # freshly-rendered one, someone hand-edited the generated file or
        # forgot to re-run the script — fail fast.
        run: |
          python3 scripts/render_bib_config.py
          git diff --exit-code install/bib-config.toml || {
            echo "::error::install/bib-config.toml is stale. Re-run scripts/render_bib_config.py and commit." >&2
            exit 1
          }
      - name: Render zero-touch kickstart for ksvalidator
        # render_zerotouch_ks.py renders install/blue-fox-install.ks.template
        # for slug=bf with a stable {{GENERATED_AT}}. The output goes through
        # ksvalidator alongside bf-os.ks and bib-config.toml in the next step.
        run: |
          python3 scripts/render_zerotouch_ks.py --slug bf --generated-at "2026-01-01T00:00:00Z" \
            > /tmp/zerotouch-rendered.ks
          python3 scripts/render_zerotouch_ks.py --slug bf-surface --generated-at "2026-01-01T00:00:00Z" \
            > /tmp/zerotouch-surface-rendered.ks

      - name: ksvalidator (bf-os.ks + bib-config + zerotouch-rendered)
        run: |
          # Extract the kickstart body out of bib-config.toml so ksvalidator
          # can lint the actual content BIB will inject into the ISO.
          python3 - <<'PY'
          import re, pathlib
          toml = pathlib.Path('install/bib-config.toml').read_text()
          m = re.search(r'contents = """(.*?)"""', toml, re.DOTALL)
          assert m, "could not extract kickstart from bib-config.toml"
          pathlib.Path('/tmp/bib-rendered.ks').write_text(m.group(1).strip() + '\n')
          PY
          docker run --rm -v "$PWD:/work" -v /tmp:/tmp fedora:41 sh -c '
            dnf -y -q install pykickstart >/dev/null 2>&1
            ksvalidator /work/install/bf-os.ks
            ksvalidator /tmp/bib-rendered.ks
            ksvalidator /tmp/zerotouch-rendered.ks
            ksvalidator /tmp/zerotouch-surface-rendered.ks
          '

  test-wizard:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install + run pytest
        run: |
          cd welcome
          pip install --quiet -e '.[test]'
          pytest -q

  build-rpm:
    # Build le RPM bluefox-welcome dans Fedora 43 (matches la version Python
    # 3.14 du base Kinoite-main, sinon depsolve echoue sur python3.Xdist()).
    #
    # Depuis le retrait du job `build`, ce RPM n'alimente plus aucune image :
    # c'est un test de non-regression du .spec (le depsolve Fedora casse a bas
    # bruit) et l'artefact reste telechargeable pour depannage. Le RPM qui finit
    # reellement dans l'image est rebuild en local par scripts/publish-image.sh.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: fedora:43
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          dnf -y -q install rpm-build python3-devel pyproject-rpm-macros \
            systemd-rpm-macros python3-setuptools python3-wheel python3-pip
      - name: Build RPM
        run: ./scripts/build-welcome-rpm.sh
      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluefox-welcome-rpm
          path: welcome/build/RPMS/noarch/bluefox-welcome-*.noarch.rpm
          retention-days: 7
          if-no-files-found: error

  validate-config:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate config/*.json against schema.v1.json
        run: |
          python3 -m pip install --quiet --user jsonschema
          python3 - <<'PY'
          import glob, json, sys
          import jsonschema
          schema = json.load(open('config/schema.v1.json'))
          rc = 0
          for path in sorted(glob.glob('config/*.json')):
              if path.endswith('schema.v1.json'):
                  continue
              data = json.load(open(path))
              try:
                  jsonschema.validate(data, schema)
                  print(f'OK    {path}  slug={data.get("slug","?")}')
              except jsonschema.ValidationError as e:
                  print(f'FAIL  {path}  {e.message}')
                  rc = 1
          sys.exit(rc)
          PY

  # BFOSL3 / P5.2 : controle de la chaine de confiance sur les images deja
  # publiees. Ne construit rien et ne depend plus du job `build` (retire) : il
  # verifie que ce que GHCR sert aujourd'hui porte toujours une signature valide
  # pour la cle publique commitee. Il attrape donc une cle rotee, un push local
  # non signe, ou une image ecrasee hors pipeline — les 3 facons dont la chaine
  # de confiance peut casser maintenant que la publication est manuelle.
  #
  # Tourne sur le cron quotidien + a la demande, PAS sur push/PR : le commit ne
  # dit plus rien de l'image publiee.
  #
  # TODO : y ajouter `cosign verify-attestation --type spdx` une fois que
  # scripts/publish-image.sh aura attache un premier SBOM aux 3 tenants. Avant
  # ca, le check echouerait tous les jours pour une raison connue (P5.2 F7).
  verify-published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        tenant: [bf, bf-surface, factice]
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Login to GHCR (private repo, image pull requires auth)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: cosign verify (latest tag)
        run: |
          cosign verify \
            --key cosign.pub \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/blue-fox-os-${{ matrix.tenant }}:latest
