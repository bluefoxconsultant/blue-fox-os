name: Build Blue Fox OS images

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'welcome/**'
      - 'install/**'
      - 'config/schema.v1.json'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    # Rebuild quotidien à 04:00 UTC pour ramasser les mises à jour upstream.
    - cron: '0 4 * * *'

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # nécessaire pour cosign keyless

    strategy:
      fail-fast: false
      matrix:
        tenant:
          - bf
          - factice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint recipes
        run: |
          python3 -c "import yaml; yaml.safe_load(open('recipes/${{ matrix.tenant }}.yml'))"
          python3 -c "import json; json.load(open('config/schema.v1.json'))"

      # Cosign keyless : signature via OIDC Sigstore Fulcio + log Rekor.
      # Pas de cle privee a gerer. id-token: write (ci-dessus) est obligatoire.
      # Verification :
      #   cosign verify ghcr.io/bluefoxconsultant/blue-fox-os-bf:TAG \
      #     --certificate-identity-regexp "https://github.com/bluefoxconsultant/blue-fox-os" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Build image (BlueBuild)
        uses: blue-build/github-action@v1
        with:
          recipe: recipes/${{ matrix.tenant }}.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          pr_event_number: ${{ github.event.number }}
          # cosign_private_key intentionnellement omis : keyless OIDC active

      - name: Output image reference
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blue-fox-os-${{ matrix.tenant }}:latest"

  release:
    # Tag v* déclenche un release : ISO + signatures + draft GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO via bootc-image-builder
        run: echo "TODO P6.1 - call bootc-image-builder, sign GPG, attach to release"
      - name: Verify cosign signatures
        run: echo "TODO - cosign verify on each tagged image"
