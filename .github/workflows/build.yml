name: Build Blue Fox OS images

on:
  push:
    branches: [main]
    tags: ['v*']     # tag v* declenche le job release (P6.1 ISO build)
    # paths filter retire : on accepte de re-run sur tous les push main
    # pour que les tag pushes (qui n'ont pas de notion de paths modifies
    # dans le sens habituel) declenchent toujours.
  pull_request:
  workflow_dispatch:
  schedule:
    # Rebuild quotidien à 04:00 UTC pour ramasser les mises à jour upstream.
    - cron: '0 4 * * *'

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}

jobs:
  validate-kickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render bib-config.toml from kickstart (drift check)
        # render_bib_config.py rewrites install/bib-config.toml from
        # install/bf-os.ks. If the committed bib-config.toml differs from the
        # freshly-rendered one, someone hand-edited the generated file or
        # forgot to re-run the script — fail fast.
        run: |
          python3 scripts/render_bib_config.py
          git diff --exit-code install/bib-config.toml || {
            echo "::error::install/bib-config.toml is stale. Re-run scripts/render_bib_config.py and commit." >&2
            exit 1
          }
      - name: Render zero-touch kickstart for ksvalidator
        # render_zerotouch_ks.py renders install/blue-fox-install.ks.template
        # for slug=bf with a stable {{GENERATED_AT}}. The output goes through
        # ksvalidator alongside bf-os.ks and bib-config.toml in the next step.
        run: |
          python3 scripts/render_zerotouch_ks.py --slug bf --generated-at "2026-01-01T00:00:00Z" \
            > /tmp/zerotouch-rendered.ks
          python3 scripts/render_zerotouch_ks.py --slug bf-surface --generated-at "2026-01-01T00:00:00Z" \
            > /tmp/zerotouch-surface-rendered.ks

      - name: ksvalidator (bf-os.ks + bib-config + zerotouch-rendered)
        run: |
          # Extract the kickstart body out of bib-config.toml so ksvalidator
          # can lint the actual content BIB will inject into the ISO.
          python3 - <<'PY'
          import re, pathlib
          toml = pathlib.Path('install/bib-config.toml').read_text()
          m = re.search(r'contents = """(.*?)"""', toml, re.DOTALL)
          assert m, "could not extract kickstart from bib-config.toml"
          pathlib.Path('/tmp/bib-rendered.ks').write_text(m.group(1).strip() + '\n')
          PY
          docker run --rm -v "$PWD:/work" -v /tmp:/tmp fedora:41 sh -c '
            dnf -y -q install pykickstart >/dev/null 2>&1
            ksvalidator /work/install/bf-os.ks
            ksvalidator /tmp/bib-rendered.ks
            ksvalidator /tmp/zerotouch-rendered.ks
            ksvalidator /tmp/zerotouch-surface-rendered.ks
          '

  test-wizard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install + run pytest
        run: |
          cd welcome
          pip install --quiet -e '.[test]'
          pytest -q
      - name: Install-time provisioning scripts (stdlib-only)
        run: pytest -q install/tests

  build-rpm:
    # Build le RPM bluefox-welcome dans Fedora 43 (matches la version Python
    # 3.14 du base Kinoite-main, sinon depsolve echoue sur python3.Xdist()).
    # Le job build le re-stage dans files/ pour que la recipe BlueBuild puisse
    # rpm-ostree install le binaire pendant la construction de l'image.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: fedora:43
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          dnf -y -q install rpm-build python3-devel pyproject-rpm-macros \
            systemd-rpm-macros python3-setuptools python3-wheel python3-pip
      - name: Build RPM
        run: ./scripts/build-welcome-rpm.sh
      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluefox-welcome-rpm
          path: welcome/build/RPMS/noarch/bluefox-welcome-*.noarch.rpm
          retention-days: 7
          if-no-files-found: error

  validate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate config/*.json against schema.v1.json
        run: |
          python3 -m pip install --quiet --user jsonschema
          python3 - <<'PY'
          import glob, json, sys
          import jsonschema
          schema = json.load(open('config/schema.v1.json'))
          rc = 0
          for path in sorted(glob.glob('config/*.json')):
              if path.endswith('schema.v1.json'):
                  continue
              data = json.load(open(path))
              try:
                  jsonschema.validate(data, schema)
                  print(f'OK    {path}  slug={data.get("slug","?")}')
              except jsonschema.ValidationError as e:
                  print(f'FAIL  {path}  {e.message}')
                  rc = 1
          sys.exit(rc)
          PY

  build:
    runs-on: ubuntu-latest
    needs: [validate-kickstart, validate-config, test-wizard, build-rpm]
    permissions:
      contents: read
      packages: write
      id-token: write   # nécessaire pour cosign keyless

    strategy:
      fail-fast: false
      matrix:
        tenant:
          - bf
          - bf-surface
          - factice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint recipes
        run: |
          python3 -c "import yaml; yaml.safe_load(open('recipes/${{ matrix.tenant }}.yml'))"
          python3 -c "import json; json.load(open('config/schema.v1.json'))"

      # Stage le RPM bluefox-welcome dans l'overlay files/ pour qu'il soit
      # present dans l'image au moment ou le module script (recipe) lance
      # rpm-ostree install. Le RPM disparait du commit final via le cleanup
      # script (voir recipes/_base notes).
      # Stage le RPM dans files/usr/share/bluefox/rpm-staging/ : le module
      # files copie files/usr/* vers /usr/* dans l'image, donc le RPM se
      # retrouvera a /usr/share/bluefox/rpm-staging/bluefox-welcome.noarch.rpm
      # ou le module script va le rpm-ostree install. /usr/share est un vrai
      # repertoire immutable de Kinoite (contrairement a /usr/local qui est
      # symlinke vers /var/usrlocal et exclu de l'image).
      - name: Download bluefox-welcome RPM
        uses: actions/download-artifact@v4
        with:
          name: bluefox-welcome-rpm
          path: files/usr/share/bluefox/rpm-staging/

      # Le snippet du module BlueBuild script ne fait pas d'expansion glob
      # (script.nu invoque commands sans subshell bash), donc on aplatit le
      # nom versionne en bluefox-welcome.noarch.rpm pour pouvoir le passer
      # litteralement a rpm-ostree install dans la recipe.
      - name: Normalize RPM filename
        run: |
          mv files/usr/share/bluefox/rpm-staging/bluefox-welcome-*.noarch.rpm \
             files/usr/share/bluefox/rpm-staging/bluefox-welcome.noarch.rpm
          ls -la files/usr/share/bluefox/rpm-staging/

      # Materialise tenant.json + branding/ → files/ AND run
      # generate_kde_theme.py to emit color scheme, look-and-feel package,
      # SDDM theme, Plymouth theme + bar PNGs, kdeglobals, icon theme,
      # neofetch config. BUILD=0 short-circuits before bluebuild — let
      # blue-build/github-action handle the actual OCI build below.
      - name: Stage branding + generate KDE theme
        run: |
          python3 -m pip install --quiet jsonschema Pillow
          SLUG="${{ matrix.tenant }}" BUILD=0 ./scripts/build_branded_iso.sh

      # Cosign signature via keypair BlueBuild canonical.
      # Note : l'action prefixe ./recipes/ au input recipe automatiquement,
      # donc on passe juste le filename (pas recipes/${{ matrix.tenant }}.yml).
      # cosign.pub committe au repo, COSIGN_PRIVATE_KEY en GH Secret.
      # Verification client : cosign verify --key cosign.pub <image>
      # Note : la roadmap BFOSD7 envisageait keyless Sigstore Fulcio, mais
      # blue-build/github-action@v1 ne supporte pas l'OIDC keyless out of the
      # box (exige cosign.key OU COSIGN_PRIVATE_KEY). Keypair est l'approche
      # canonique BlueBuild ; cle privee scopee aux GH Actions seulement.
      - name: Build image (BlueBuild)
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.tenant }}.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          pr_event_number: ${{ github.event.number }}
          # Sans ca, l'action fait un re-checkout + git clean -ffdx qui
          # supprime notre RPM stage en untracked dans files/usr/share/.
          skip_checkout: "true"

      - name: Output image reference
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blue-fox-os-${{ matrix.tenant }}:latest"

  # P5.2 F7 : attache un SBOM SPDX-JSON signé en attestation cosign à chaque
  # image OCI publiée. Comble le gap identifié au pré-audit P5.2 (cosign tree
  # ne montrait que la signature). Verification client : cosign verify-attestation
  # --key cosign.pub --type spdx <image>.
  attest-sbom:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        tenant: [bf, bf-surface, factice]
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3

      # Image OCI ~9 GB par tenant ; le runner ubuntu-latest a ~14 GB free
      # par defaut. Sans cette etape, syft sature le disque pendant la copie
      # Docker tar de l'image. Meme action que le release job utilise.
      - name: Maximize build space
        uses: hastd/free-disk-space@v0.1.2
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft version

      # Auth GHCR : le repo ghcr.io/bluefoxconsultant/blue-fox-os-* est prive,
      # syft doit s'authentifier. SYFT_REGISTRY_AUTH_* + le prefixe
      # registry: forcent le pull via l'API OCI (pas via le docker daemon
      # qui exploserait l'espace disque local).
      #
      # Scope = squashed : un seul SBOM sur l'image flattenee plutot que
      # par layer. Evite l'OOM observe au run 25604321931 ou syft avec
      # scope=all-layers (defaut) tournait > 50 min sur l'image Kinoite
      # (~9 GB, ~30 layers) et le runner perdait communication avec le
      # serveur GH Actions a 50 min (RAM ~7 GB epuisee). Le scope
      # squashed reflete ce que les utilisateurs exploitent au runtime :
      # c'est le bon scope pour un SBOM.
      - name: Generate SBOM (SPDX JSON)
        env:
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          syft scan registry:${{ env.REGISTRY }}/${{ github.repository_owner }}/blue-fox-os-${{ matrix.tenant }}:latest \
            --scope squashed \
            -o spdx-json=sbom.spdx.json
          ls -lh sbom.spdx.json
      - name: Attest SBOM via cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdx \
            --key env://COSIGN_PRIVATE_KEY \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/blue-fox-os-${{ matrix.tenant }}:latest
      - name: Verify attestation roundtrip
        run: |
          cosign verify-attestation \
            --key cosign.pub \
            --type spdx \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/blue-fox-os-${{ matrix.tenant }}:latest \
            > /dev/null
          echo "Attestation verified for blue-fox-os-${{ matrix.tenant }}"

  # BFOSL3 / P5.2 : smoke test du pipeline securite. Apres chaque push main,
  # verifie que la nouvelle image OCI publiee est bien signable + verifiable
  # avec la cle publique commitee. Coupe la chaine de confiance si jamais
  # cosign keypair est rotated ou que l'image n'a pas ete signee.
  verify-published:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        tenant: [bf, bf-surface, factice]
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Login to GHCR (private repo, image pull requires auth)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: cosign verify (latest tag)
        run: |
          cosign verify \
            --key cosign.pub \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/blue-fox-os-${{ matrix.tenant }}:latest

  # P6.1 : tag v* declenche un release. Pour chaque tenant publie, pull
  # l'image OCI taggee, l'ISO-ifie via bootc-image-builder, signe avec
  # cosign keyless (Sigstore Fulcio + Rekor), attache a un draft GitHub
  # release. Verification client : cosign verify-blob --certificate-* iso.sig.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
      id-token: write   # cosign keyless OIDC
    strategy:
      fail-fast: false
      matrix:
        tenant:
          - bf
          - bf-surface
          # factice exclu : whitelabel test, jamais distribue
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3

      # Le runner ubuntu-latest n'a que ~14 GB free par defaut.
      # OCI image (~9 GB) + ISO build (~5 GB) sature. On retire le software
      # pre-installe inutile (Android SDK, .NET, Haskell, toolcache) pour
      # liberer ~30 GB. Meme action que BlueBuild utilise.
      - name: Maximize build space
        uses: hastd/free-disk-space@v0.1.2
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q podman

      - name: Login to GHCR (private repo)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # BlueBuild ne publie pas le tag {ref_name} brut sur tag push : il
      # taggue avec un prefixe (`br-{ref_name}-{fedora_version}`) qui est
      # fragile a referencer. Le tag push pointe sur main HEAD donc :latest
      # (publie au merge precedent vers main) contient le meme commit. On
      # tire :latest qui est stable.
      - name: Pull tenant OCI image
        run: sudo podman pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/blue-fox-os-${{ matrix.tenant }}:latest

      # Render install/bib-config.toml from install/bf-os.ks. BIB embeds this
      # as the kickstart so Anaconda prompts for LUKS passphrase + user
      # creation per BF spec (otherwise BIB falls back to a bare OSTree-only
      # kickstart with no auth prompt).
      - name: Render BIB config from kickstart
        run: python3 scripts/render_bib_config.py

      - name: Build Anaconda ISO via bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/install/bib-config.toml:/config.toml:ro" \
            -v "$(pwd)/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --use-librepo=true \
            --rootfs btrfs \
            --config /config.toml \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/blue-fox-os-${{ matrix.tenant }}:latest

      # Brand the ISO chrome (boot menu, GRUB theme, splash). Must happen
      # BEFORE sha256/cosign so the signature covers the branded artifact.
      - name: Brand ISO chrome
        run: |
          # squashfs-tools is required by scripts/inject-anaconda-product.sh
          # (called from brand-iso.sh) to overlay the Anaconda chrome into
          # the stage2 squashfs of the ISO.
          sudo apt-get install -y -q xorriso squashfs-tools
          sudo ./scripts/brand-iso.sh output/bootiso/install.iso

      # GitHub Releases plafonne a 2 GiB par asset. Une ISO Anaconda + le
      # squashfs du rootfs Kinoite + BF fait ~5 GiB. xz n'aide pas (data
      # deja compressee). On signe + sha l'ISO complet, puis on splite en
      # parts de 1900 MiB pour upload. Users recombinent avec `cat`.
      - name: Stage + sign + split ISO
        run: |
          ISO_NAME="blue-fox-os-${{ matrix.tenant }}-${{ github.ref_name }}.iso"
          sudo mv output/bootiso/install.iso "output/$ISO_NAME"
          sudo chown -R "$USER:$USER" output
          cd output
          ls -lh "$ISO_NAME"

          # 1. SHA256 + cosign keyless sur le fichier complet (avant split).
          sha256sum "$ISO_NAME" > "$ISO_NAME.sha256"
          cosign sign-blob --yes \
            --output-certificate "$ISO_NAME.cert" \
            --output-signature "$ISO_NAME.sig" \
            "$ISO_NAME"

          # 2. Split en parts de 1900 MiB (sous le seuil 2 GiB GH).
          # Suffix numerique 2-digit, padded zero : .part-00 .part-01 .part-02
          split -b 1900M -d -a 2 "$ISO_NAME" "$ISO_NAME.part-"
          ls -lh "$ISO_NAME"*

          # 3. Free disk : on garde sig/cert/sha256/parts, on supprime l'ISO
          # original (les parts permettent de le reconstruire).
          rm "$ISO_NAME"
          ls -lh

      # Genere un README de reassemblage pour les users.
      - name: Write reassembly README
        run: |
          BASE="blue-fox-os-${{ matrix.tenant }}-${{ github.ref_name }}"
          cat > "output/$BASE.iso.README.md" <<EOF
          # Blue Fox OS ISO — Reassembly & Verification

          GitHub Releases plafonnent a 2 GiB par fichier ; l'ISO de ${{ matrix.tenant }}
          (~5 GiB) est splitee en parts. Les commandes suivantes telechargent,
          recombinent et verifient l'ISO complete.

          ## 1. Telecharger les parts + signatures

          \`\`\`bash
          gh release download ${{ github.ref_name }} -p '$BASE.iso.part-*' -p '$BASE.iso.sha256' -p '$BASE.iso.sig' -p '$BASE.iso.cert'
          \`\`\`

          ## 2. Recombiner

          \`\`\`bash
          cat $BASE.iso.part-* > $BASE.iso
          rm $BASE.iso.part-*
          \`\`\`

          ## 3. Verifier l'integrite (SHA256)

          \`\`\`bash
          sha256sum -c $BASE.iso.sha256
          \`\`\`

          ## 4. Verifier la signature cosign keyless (Sigstore)

          \`\`\`bash
          cosign verify-blob \\
            --certificate $BASE.iso.cert \\
            --signature $BASE.iso.sig \\
            --certificate-identity-regexp '^https://github.com/bluefoxconsultant/.*' \\
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\
            $BASE.iso
          \`\`\`

          ## 5. Flasher sur USB

          \`\`\`bash
          sudo dd if=$BASE.iso of=/dev/sdX bs=4M status=progress oflag=sync
          \`\`\`

          (\`/dev/sdX\` = ton cle USB, verifier avec \`lsblk\` avant.)
          EOF

      - name: Attach to GitHub release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            output/blue-fox-os-${{ matrix.tenant }}-${{ github.ref_name }}.iso.part-*
            output/blue-fox-os-${{ matrix.tenant }}-${{ github.ref_name }}.iso.sha256
            output/blue-fox-os-${{ matrix.tenant }}-${{ github.ref_name }}.iso.sig
            output/blue-fox-os-${{ matrix.tenant }}-${{ github.ref_name }}.iso.cert
            output/blue-fox-os-${{ matrix.tenant }}-${{ github.ref_name }}.iso.README.md
