<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Blue Fox OS — Lexend par défaut système-wide.

  Sans cette règle, les apps qui demandent "sans-serif" générique (Brave web
  pages, apps GTK sans réglage explicite, certains widgets Qt sans famille
  spécifiée) fallback sur la default Fedora (Cantarell). kdeglobals font=Lexend
  ne couvre que les apps KDE/Qt qui lisent kdeglobals — pas le reste.

  Ce fichier précède 99 dans l'ordre lexical fontconfig (les 60-* upstream
  Fedora qui définissent sans-serif=Cantarell, etc.). Numérotation choisie :
  95 = surclasse les 60-* mais reste après les 50-* user-overridable.

  Source : https://www.freedesktop.org/software/fontconfig/fontconfig-user.html
-->
<fontconfig>

  <!-- Lexend devient le sans-serif par défaut pour toutes les apps. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Lexend</family>
    </prefer>
  </alias>

  <!-- "sans" et "system-ui" (CSS standard) → Lexend aussi. -->
  <alias>
    <family>sans</family>
    <prefer>
      <family>Lexend</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Lexend</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>Lexend</family>
    </prefer>
  </alias>

  <!-- Hack reste mono par défaut (cohérent avec kdeglobals fixed=Hack).
       Pas de remplacement de monospace ici — on respecte la default Fedora. -->

</fontconfig>
