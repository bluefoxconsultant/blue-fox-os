# Recipe Blue Fox OS - tenant BF (interne).
# Voir recipes/_base.yml pour le rationale des modules.

name: blue-fox-os-bf
description: Blue Fox OS - image BF (pilote interne Olivier + Jace)

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:

  - type: rpm-ostree
    repos:
      - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      - tailscale
      - rclone           # P4.1 : rclone mount NC via systemd --user (BFOSP3)
      - fuse3            # rclone mount needs fusermount3
      - plymouth-plugin-script   # script.so requis par Plymouth theme [#22420]
    remove:
      - firefox
      - firefox-langpacks
    # Lexend : pas de paquet dans les repos Fedora, les TTFs sont
    # shippes via le module `files` ci-dessous (files/usr/share/fonts/lexend/).

  # Pin to @v1 — v2 has breaking schema changes documented at
  # https://blue-build.org/reference/modules/default-flatpaks/
  - type: default-flatpaks@v1
    notify: true
    system:
      repo-url: https://flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      install:
        - com.brave.Browser
        - org.mozilla.Thunderbird
        - com.nextcloud.desktopclient.nextcloudclient
        - com.bitwarden.desktop   # P4.1 : pre-seed Vaultwarden URL via apply_bitwarden_prefs

  # Note : `files` DOIT venir avant `script` puis `systemd` (gotcha BlueBuild
  # #5) sinon le RPM n'est pas en place et systemd ne trouve pas le .service.
  - type: files
    files:
      # source est relatif a <repo>/files/ ; pas besoin du prefixe files/.
      - source: usr
        destination: /usr
      # /etc/xdg/kdeglobals + /etc/sddm.conf.d/blue-fox.conf + /etc/skel/.config
      # sont matérialisés par scripts/generate_kde_theme.py à partir de bf.json.
      - source: etc
        destination: /etc
      # Branding BF : wallpapers, splash Plymouth, theme Plasma, theme SDDM
      # Les fichiers sont matérialisés à partir de config/bf.json par le
      # script scripts/build_branded_iso.sh avant invocation BlueBuild.

  # Installe le RPM bluefox-welcome stage par la CI dans
  # files/usr/share/bluefox/rpm-staging/. Apres install, on retire le RPM
  # source pour ne pas trainer 100 KB inutiles dans l'image finale.
  # Refresh fontconfig cache pour les Lexend TTFs hand-baked (les RPM fonts
  # ont fc-cache dans leur scriptlet, pas les fichiers via module `files`).
  # Sans ça, `fc-match sans-serif` peut retourner Cantarell au premier boot.
  # Plymouth : bake notre theme (généré par generate_kde_theme.py et déjà
  # en place dans /usr/share/plymouth/themes/<slug>/) dans l'initramfs, sinon
  # le splash BF est invisible pendant LUKS prompt + early boot (rapporté par
  # Olivier sur #22420 : « No splash screen, should have branded splash +
  # Blue Fox OS logo »).
  #
  # ⚠️ DEUX PIEGES, corriges le 2026-07-19 apres que le splash LUKS soit
  # ressorti en Fedora sur la machine installee :
  #   1. `dracut --regenerate-all` MEURT sur une image bootc :
  #      « dracut[F]: Invalid tmpdir '/var/tmp' » — /var est vide a la
  #      construction, il n'est peuple qu'au deploiement. D'ou --tmpdir /tmp.
  #   2. Meme repare, --regenerate-all ecrit dans /boot/initramfs-<kver>.img,
  #      que ostree IGNORE : une image ostree lit son initramfs dans
  #      /usr/lib/modules/<kver>/initramfs.img. On cible donc explicitement.
  # Le snippet se terminait en exit 1 sans faire echouer le build — d'ou un
  # defaut qui a traverse tous les builds depuis #22420. Il verifie maintenant
  # que le theme est bien DANS l'initramfs et echoue sinon.
  - type: script
    snippets:
      - rpm-ostree install /usr/share/bluefox/rpm-staging/bluefox-welcome.noarch.rpm && rm -rf /usr/share/bluefox/rpm-staging
      - fc-cache -f /usr/share/fonts/lexend/
      # `-R` retombe sur uname -r = kernel HOTE du build agent, qui n'est
      # pas dans /lib/modules/ de l'image -> dracut FAIL. Split : symlink
      # + conf via set-default-theme, puis dracut --regenerate-all qui
      # itere sur /lib/modules/* (ignore uname -r).
      - PLYMOUTH_THEME=$(awk -F= '/^Theme=/{print $2}' /etc/plymouth/plymouthd.conf) && [ -n "$PLYMOUTH_THEME" ] && plymouth-set-default-theme "$PLYMOUTH_THEME" && for KDIR in /usr/lib/modules/*/; do KVER=$(basename "$KDIR"); dracut -f --kver "$KVER" --tmpdir /tmp "${KDIR}initramfs.img" || exit 1; lsinitrd "${KDIR}initramfs.img" | grep -q "plymouth/themes/${PLYMOUTH_THEME}/" || { echo "ERREUR - theme ${PLYMOUTH_THEME} absent de ${KDIR}initramfs.img"; exit 1; }; done
      # Nom de marque dans l'entree de demarrage. Les entrees BLS derivent de
      # /usr/lib/os-release (/etc/os-release en est un lien) : sans ca le menu
      # GRUB du systeme installe affiche « Fedora Linux 44 (Kinoite) ».
      # ⚠️ On ne touche PAS a ID=fedora : rpm-ostree, les depots tiers et de
      # nombreux scripts s'y fient. Corollaire assume : la detection auto du
      # profil Anaconda (`os_id = blue-fox-os` dans blue-fox-os.conf) ne peut
      # pas matcher, d'ou `inst.profile=blue-fox-os` force au boot par
      # scripts/brand-iso.sh.
      - . /usr/lib/os-release && sed -i "s|^NAME=.*|NAME=\"Blue Fox OS\"|; s|^PRETTY_NAME=.*|PRETTY_NAME=\"Blue Fox OS ${VERSION_ID} (Kinoite)\"|" /usr/lib/os-release

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer
        - bluefox-rebase.service   # premier rebase apres install KS, conditionne au sentinelle
        - firstboot.service        # P4.1 : welcome wizard au premier boot, conditionne au sentinelle /var/lib/bluefox-welcome/done
        # Auto-deverrouillage LUKS par TPM2, pilote par la policy Odoo
        # (policies.tpm_autounlock). Inerte tant que le champ est a faux, donc
        # sans effet sur les machines existantes. Doit rester une unite ROOT :
        # systemd-cryptenroll ne tourne pas en tant qu'utilisateur.
        - bluefox-tpm-enroll.service
      masked:
        - tailscaled.service       # user doit `systemctl enable --now tailscaled` consciemment

  - type: signing

# Variante Surface (Olivier Surface Studio + Pro 7+) : recipe `bf-surface.yml`
# qui layered le kernel linux-surface depuis le repo Copr.
