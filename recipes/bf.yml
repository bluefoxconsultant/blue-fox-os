# Recipe Blue Fox OS - tenant BF (interne).
# Voir recipes/_base.yml pour le rationale des modules.

name: blue-fox-os-bf
description: Blue Fox OS - image BF (pilote interne Olivier + Jace)

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

# Provenance de l'image (#23810, audit P5.2 blocage B2). BlueBuild pose de
# lui-meme title / description / source / base.name / base.digest / created,
# mais PAS revision : rien ne rattachait une image publiee a son commit. Deux
# mois de publications depuis un checkout perime ont passe inapercus, et c'est
# un label — la description — qui a fini par le reveler.
#
# ${BF_GIT_REVISION} est exporte par scripts/publish-image.sh, qui refuse par
# ailleurs de publier depuis un arbre sale ou en retard.
#
# ⚠️ BlueBuild resout ces valeurs avec shellexpand SANS erreur sur variable
# absente : un build lance a la main, sans la variable, publie le litteral
# « ${BF_GIT_REVISION} » comme revision. L'etape 7 du script relit donc
# l'etiquette publiee au lieu de se fier a l'export.
labels:
  org.opencontainers.image.revision: "${BF_GIT_REVISION}"
  # ⚠️ BlueBuild pose bien `source` de lui-meme, mais il le derive des variables
  # d'environnement de la CI : hors CI il vaut la CHAINE VIDE. Constate sur
  # l'image construite le 2026-07-25 (`LABEL org.opencontainers.image.source=""`).
  # Depuis que tous les builds sont locaux, l'etiquette etait donc toujours vide —
  # et une revision sans depot ne designe rien : un sha n'a de sens que rattache
  # a un remote. On la fixe ici, ou les labels personnalises l'emportent sur les
  # defauts du CLI.
  org.opencontainers.image.source: "https://github.com/bluefoxconsultant/blue-fox-os"

modules:

  - type: rpm-ostree
    repos:
      # ⚠️ Fichier .repo VERSIONNE (files/rpm-ostree/tailscale.repo) plutot
      # que telecharge a chaque construction (2026-09-14). pkgs.tailscale.com
      # coupe ~1 connexion TLS sur 4 depuis charizard, et le module rpm-ostree
      # le tirait par `curl --retry 5` — mais --retry ne reessaie PAS une
      # erreur TLS (code 35) : il faudrait --retry-all-errors. Une coupure
      # tuait donc la construction entiere, et elle a tue bf, bf-surface et
      # factice tour a tour. Une entree sans http(s):// est COPIEE depuis
      # $CONFIG_DIRECTORY/rpm-ostree/ par le module : aucun reseau. Les
      # paquets, eux, restent tires par dnf, qui reessaie, et verifies
      # (gpgcheck=1, repo_gpgcheck=1).
      - tailscale.repo
    install:
      - tailscale
      - rclone           # P4.1 : rclone mount NC via systemd --user (BFOSP3)
      - fuse3            # rclone mount needs fusermount3
      - plymouth-plugin-script   # script.so requis par Plymouth theme [#22420]
      # Connexion de siege sur l'avant-poste LDAP d'Authentik (#22387). La base
      # kinoite-main ne porte que sssd-client : le demon, le fournisseur LDAP,
      # oddjobd et son module PAM manquent tous. Sans eux, les trois gestes du
      # chemin sssd de bfos_apply.py echouent EN SILENCE (check=False) et la
      # machine n'a aucune session ouvrable — soit exactement #23906 par un
      # autre chemin. Le controle de construction plus bas les affirme.
      - sssd
      - sssd-ldap
      - oddjob
      - oddjob-mkhomedir
      # Le renard dans le terminal (#25854). ⚠️ NI fastfetch NI neofetch ne sont
      # dans kinoite-main : mesure du 2026-09-20 sur l'image publiée (`rpm -q`
      # rend « not installed » pour les deux). La config émise dans /etc/skel
      # n'aurait eu personne pour la lire.
      - fastfetch
    remove:
      # ⚠️ RETIRE LE 2026-09-11, a la demande d'Olivier. plasma-welcome est le
      # Centre d'accueil de KDE : il redemande langue, clavier, fuseau ET
      # theme au premier demarrage, alors que la politique les fixe deja. Le
      # resultat est pire qu'une question inutile — on choisit « sombre » et
      # autre chose l'ecrase, ce qui donne un reglage qui ne prend pas.
      #
      # ⚠️ Pourquoi retirer le paquet plutot que couper son demarrage : ce
      # n'est PAS un autostart mais un module KDED
      # (kded_plasma_welcome.so), dont l'identifiant vit dans des metadonnees
      # Qt6 en CBOR — illisible avec `strings`. Un `[Module-<id>]` devine dans
      # kdedrc ne couperait rien du tout, en silence. Retirer le paquet ne se
      # devine pas : `rpm -q` tranche.
      #
      # Corollaire assume : on perd la page d'intro brandee que
      # files/usr/share/plasma/plasma-welcome/ lui livrait.
      - plasma-welcome
      - firefox
      - firefox-langpacks
    # Lexend : pas de paquet dans les repos Fedora, les TTFs sont
    # shippes via le module `files` ci-dessous (files/usr/share/fonts/lexend/).

  # Pin to @v1 — v2 has breaking schema changes documented at
  # https://blue-build.org/reference/modules/default-flatpaks/
  - type: default-flatpaks@v1
    notify: true
    system:
      repo-url: https://flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      install:
        - com.brave.Browser
        - org.mozilla.Thunderbird
        # ⚠️ CORRIGE LE 2026-09-11. L'identifiant etait
        # com.nextcloud.desktopclient.nextcloudclient — il n'existe PAS sur
        # Flathub (404). Et `flatpak install` sur une liste abandonne TOUT le
        # lot au premier identifiant inconnu : aucune application n'arrivait,
        # Brave compris, donc aucun navigateur pour le SSO de l'agent d'accueil.
        # Verifie contre https://flathub.org/api/v2/appstream/<id> avant d'ecrire.
        - com.nextcloud.desktopclient.nextcloud
        - com.bitwarden.desktop   # P4.1 : pre-seed Vaultwarden URL via apply_bitwarden_prefs

  # Note : `files` DOIT venir avant `script` puis `systemd` (gotcha BlueBuild
  # #5) sinon le RPM n'est pas en place et systemd ne trouve pas le .service.
  - type: files
    files:
      # source est relatif a <repo>/files/ ; pas besoin du prefixe files/.
      - source: usr
        destination: /usr
      # /etc/xdg/kdeglobals + /etc/plasmalogin.conf.d/ + /etc/skel/.config
      # sont matérialisés par scripts/generate_kde_theme.py à partir de bf.json.
      - source: etc
        destination: /etc
      # Branding BF : wallpapers, splash Plymouth, theme Plasma, ecran de connexion
      # Les fichiers sont matérialisés à partir de config/bf.json par le
      # script scripts/build_branded_iso.sh avant invocation BlueBuild.

  # Installe le RPM bluefox-welcome stage par la CI dans
  # files/usr/share/bluefox/rpm-staging/. Apres install, on retire le RPM
  # source pour ne pas trainer 100 KB inutiles dans l'image finale.
  # Refresh fontconfig cache pour les Lexend TTFs hand-baked (les RPM fonts
  # ont fc-cache dans leur scriptlet, pas les fichiers via module `files`).
  # Sans ça, `fc-match sans-serif` peut retourner Cantarell au premier boot.
  # Plymouth : bake notre theme (généré par generate_kde_theme.py et déjà
  # en place dans /usr/share/plymouth/themes/<slug>/) dans l'initramfs, sinon
  # le splash BF est invisible pendant LUKS prompt + early boot (rapporté par
  # Olivier sur #22420 : « No splash screen, should have branded splash +
  # Blue Fox OS logo »).
  #
  # ⚠️ DEUX PIEGES, corriges le 2026-07-19 apres que le splash LUKS soit
  # ressorti en Fedora sur la machine installee :
  #   1. `dracut --regenerate-all` MEURT sur une image bootc :
  #      « dracut[F]: Invalid tmpdir '/var/tmp' » — /var est vide a la
  #      construction, il n'est peuple qu'au deploiement. D'ou --tmpdir /tmp.
  #   2. Meme repare, --regenerate-all ecrit dans /boot/initramfs-<kver>.img,
  #      que ostree IGNORE : une image ostree lit son initramfs dans
  #      /usr/lib/modules/<kver>/initramfs.img. On cible donc explicitement.
  # Le snippet se terminait en exit 1 sans faire echouer le build — d'ou un
  # defaut qui a traverse tous les builds depuis #22420. Il verifie maintenant
  # que le theme est bien DANS l'initramfs et echoue sinon.
  - type: script
    snippets:
      # bluefox-welcome : signature VERIFIEE avant installation (#23811).
      # `rpm-ostree install <chemin>` ne verifie rien sur un fichier local, et
      # c'etait le seul paquet superpose non signe de l'image — le notre, celui
      # qui porte le provisionnement OIDC. Le detail est dans l'entete de
      # files/scripts/install-welcome-rpm.sh.
      #
      # La resolution a deux racines vient du module `script` v1 : il cherche
      # ses `scripts:` sous $CONFIG_DIRECTORY/scripts, or CONFIG_DIRECTORY vaut
      # /tmp/config (config complet monte) OU /tmp/files (seul files/ monte)
      # selon la version de BlueBuild. Les deux candidats designent le meme
      # dossier in-repo : files/scripts/.
      - for D in "${CONFIG_DIRECTORY}/scripts" "${CONFIG_DIRECTORY}/files/scripts"; do [ -f "$D/install-welcome-rpm.sh" ] && exec bash "$D/install-welcome-rpm.sh"; done; echo "ERREUR - install-welcome-rpm.sh introuvable sous ${CONFIG_DIRECTORY}" >&2; exit 1
      - fc-cache -f /usr/share/fonts/lexend/
      # Les tables MIME de Fedora designent firefox pour http/https/text-html,
      # or la recette le RETIRE de l'image. Un gestionnaire fantome fait
      # descendre xdg-open jusqu'au premier programme revendiquant text/html
      # — un editeur de texte. Vecu le 2026-07-19 (« le bouton ouvre Kate »),
      # et ça cassait aussi le bouton SSO Nextcloud, donc le montage.
      # Notre /etc/xdg/mimeapps.list (Brave) reste seul en place.
      - sed -i "/=org\.mozilla\.firefox\.desktop$/d" /usr/share/applications/mimeapps.list
      # Nom de marque dans l'entree de demarrage. Les entrees BLS derivent de
      # /usr/lib/os-release (/etc/os-release en est un lien) : sans ca le menu
      # GRUB du systeme installe affiche « Fedora Linux 44 (Kinoite) ».
      #
      # ⚠️ CE SNIPPET DOIT RESTER AVANT LE BAKE DRACUT CI-DESSOUS (2026-07-25).
      # dracut copie os-release dans l'initramfs sous le nom `initrd-release` —
      # c'est de la que Plymouth tire le nom du systeme sur l'ecran de
      # deverrouillage LUKS. Tant que ce sed passait APRES le bake, l'initramfs
      # embarquait PRETTY_NAME="Fedora Linux 43…" et l'ecran LUKS affichait
      # « Fedora ». Verifie en extrayant usr/lib/initrd-release de l'initramfs de
      # l'image du 2026-07-25. Un test (scripts/tests/test_os_release_order.py)
      # garde cet ordre.
      #
      # ⚠️ On ne touche PAS a ID=fedora : rpm-ostree, les depots tiers et de
      # nombreux scripts s'y fient. Corollaire assume : la detection auto du
      # profil Anaconda (`os_id = blue-fox-os` dans blue-fox-os.conf) ne peut
      # pas matcher, d'ou `inst.profile=blue-fox-os` force au boot par
      # scripts/brand-iso.sh.
      #
      # ⚠️ Ce qui NE se corrige PAS ici : /etc/system-release et
      # /usr/lib/fedora-release restent « Fedora release 43 (Forty Three) »
      # (paquet fedora-release). VARIANT="Kinoite" reste aussi tel quel.
      - . /usr/lib/os-release && sed -i "s|^NAME=.*|NAME=\"Blue Fox OS\"|; s|^PRETTY_NAME=.*|PRETTY_NAME=\"Blue Fox OS ${VERSION_ID} (Kinoite)\"|" /usr/lib/os-release
      # `-R` retombe sur uname -r = kernel HOTE du build agent, qui n'est
      # pas dans /lib/modules/ de l'image -> dracut FAIL. Split : symlink
      # + conf via set-default-theme, puis dracut --regenerate-all qui
      # itere sur /lib/modules/* (ignore uname -r).
      - PLYMOUTH_THEME=$(awk -F= '/^Theme=/{print $2}' /etc/plymouth/plymouthd.conf) && [ -n "$PLYMOUTH_THEME" ] && plymouth-set-default-theme "$PLYMOUTH_THEME" && for KDIR in /usr/lib/modules/*/; do KVER=$(basename "$KDIR"); dracut -f --kver "$KVER" --add ostree --no-hostonly --tmpdir /tmp "${KDIR}initramfs.img" || exit 1; lsinitrd "${KDIR}initramfs.img" | grep -q "plymouth/themes/${PLYMOUTH_THEME}/" || { echo "ERREUR - theme ${PLYMOUTH_THEME} absent de ${KDIR}initramfs.img"; exit 1; }; for M in ostree btrfs crypt dm systemd-cryptsetup plymouth; do lsinitrd "${KDIR}initramfs.img" | sed -n "/^dracut modules:/,/^===/p" | grep -qx "$M" || { echo "ERREUR - module dracut $M absent de ${KDIR}initramfs.img ; sans ostree rien ne prepare /sysroot et switch-root echoue"; exit 1; }; done; done
      # Connexion de siege (#22387) : le chemin sssd de bfos_apply.py fait ses
      # trois gestes en check=False. Si un morceau manque de l'image, ils
      # echouent sans bruit et la machine n'ouvre aucune session, soit le meme
      # symptome que #23906. On l'affirme donc ici, ou l'echec coute un build
      # et pas une installation complete. Chemins releves sur Fedora 44.
      - for F in /usr/sbin/sssd /usr/lib64/sssd/libsss_ldap.so /usr/lib64/security/pam_sss.so /usr/lib64/security/pam_oddjob_mkhomedir.so /usr/sbin/oddjobd /usr/lib/systemd/system/sssd.service /usr/lib/systemd/system/oddjobd.service; do [ -e "$F" ] || { echo "ERREUR - $F absent, le mode login sssd n'ouvrirait aucune session"; exit 1; }; done; authselect list | grep -qw sssd || { echo "ERREUR - profil authselect sssd absent de l'image"; exit 1; }
      # Le Centre d'accueil de KDE doit avoir DISPARU (#2026-09-11). Il
      # rouvre sa visite guidee DANS la session et reecrit le theme que la
      # politique fixe deja. `rpm -q` est le seul controle qui tranche — son
      # module KDED ne se coupe pas par un reglage devinable.
      #
      # ⚠️ CE N EST PAS LUI QUI OUVRE L ASSISTANT DU PREMIER DEMARRAGE
      # (mesure le 2026-09-13 sur l image publiee, rev. 9d81537). Ca, c est
      # `plasma-setup`, un AUTRE paquet, qui tourne AVANT le gestionnaire de
      # connexion et ne depend que d un drapeau. Retirer plasma-welcome ne l a
      # jamais touche. On pose donc le drapeau par le module `files`, et on
      # affirme ici LES DEUX MOITIES du mecanisme : le drapeau existe, et
      # l unite se garde toujours sur ce chemin. Si une version future deplace
      # le drapeau, le build echoue au lieu de rendre l assistant en silence.
      - rpm -q plasma-welcome >/dev/null 2>&1 && { echo "ERREUR - plasma-welcome est encore dans l image, il reposera les questions de la politique"; exit 1; } || true
      - U=/usr/lib/systemd/system/plasma-setup.service; if [ -e "$U" ]; then grep -q '^ConditionPathExists=!/etc/plasma-setup-done$' "$U" || { echo "ERREUR - plasma-setup.service ne se garde plus sur /etc/plasma-setup-done, relire l unite avant de publier"; exit 1; }; [ -f /etc/plasma-setup-done ] || { echo "ERREUR - /etc/plasma-setup-done absent, l assistant OOBE de KDE s ouvrirait avant le gestionnaire de connexion"; exit 1; }; fi
      # L ecran de connexion, et le gestionnaire qui le rend (2026-09-13).
      #
      # ⚠️ NOTRE PARC STRADDLE DEUX GENERATIONS. bf et factice suivent
      # kinoite-main:latest, donc Fedora 44, ou SDDM a cede la place a
      # plasmalogin. bf-surface est EPINGLE en 43 pour le noyau linux-surface,
      # et y tourne encore sur sddm. Mesure sur les images publiees.
      #
      # Les deux configurations sont donc emises, et c est ICI qu on exige
      # celle que l image cable vraiment — en lisant display-manager plutot
      # qu en supposant. Une configuration pour un greeter absent ne coute que
      # quelques centaines d octets ; la manquer coute un ecran de connexion
      # sans marque, et ca ne se voit qu a l installation.
      #
      # Un greeter inconnu echoue aussi : le silence serait le retour au fond
      # de Fedora, sans un mot.
      - D=/etc/systemd/system/display-manager.service; C="$(readlink -f "$D" 2>/dev/null)"; case "$C" in *plasmalogin*) [ -f /etc/plasmalogin.conf.d/10-bluefox.conf ] || { echo "ERREUR - greeter plasmalogin mais drop-in /etc/plasmalogin.conf.d absent, l ecran de connexion servirait le papier peint de Fedora"; exit 1; };; *sddm*) [ -f /etc/sddm.conf.d/blue-fox.conf ] || { echo "ERREUR - greeter sddm mais /etc/sddm.conf.d/blue-fox.conf absent, l ecran de connexion resterait sans marque"; exit 1; };; *) { echo "ERREUR - gestionnaire de connexion inconnu [$C], aucune de nos deux configurations ne serait lue"; exit 1; };; esac

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer
        - bluefox-rebase.service   # premier rebase apres install KS, conditionne au sentinelle
        # ⚠️ firstboot.service RETIRE le 2026-09-14. Il lancait l'agent d'accueil
        # EN TANT QUE ROOT, au demarrage, avant toute session : l'agent trouvait
        # les identifiants Nextcloud, appliquait theme, fond d'ecran, montages et
        # PWA dans /root, puis effacait les identifiants. La session de l'usager
        # n'avait plus rien a faire. Le lanceur /etc/xdg/autostart suffit, et
        # l'unite le documentait elle-meme sans en tirer la consequence.
        # Auto-deverrouillage LUKS par TPM2, pilote par la policy Odoo
        # (policies.tpm_autounlock). Inerte tant que le champ est a faux, donc
        # sans effet sur les machines existantes. Doit rester une unite ROOT :
        # systemd-cryptenroll ne tourne pas en tant qu'utilisateur.
        - bluefox-tpm-enroll.service
        # Re-synchronisation de la politique (#23909) : sans elle, une machine
        # garde a vie la politique du jour de son installation. Conditionnee a
        # /etc/bluefox/machine.json, donc inerte sur un poste non enrole.
        - bluefox-policy-sync.timer
        # Remise des identifiants Nextcloud au siege (#22436). Le %pre les
        # frappe pendant que le porteur de l'operateur vaut encore, le %post
        # les depose en 0600 root ; l'uid du siege vient de l'annuaire et
        # n'est connaissable qu'ici. Conditionnee au fichier, donc inerte sur
        # un poste qui n'en a pas.
        - bluefox-seat-credentials.service
        # ⚠️ RENVERSEMENT ASSUME (2026-09-03), dont la JUSTIFICATION A CHANGE
        # le 2026-09-11. tailscaled etait MASQUE, avec la consigne
        # « l'utilisateur doit l'activer consciemment ». Le demasquage a ete
        # fait pour la connexion de siege, qu'on croyait alors devoir passer
        # par le tailnet pour joindre l'avant-poste LDAP d'Authentik.
        #
        # Ce n'est plus le chemin retenu : l'avant-poste est joint en LDAPS
        # public (#22387, arbitrage du 2026-09-11), donc la premiere ouverture
        # de session ne depend plus du tailnet. Le demasquage reste en place,
        # mais il ne porte plus rien de critique. Le defaire serait une
        # decision, pas un menage : un service masque ne peut meme pas etre
        # demarre par le %post, c'est tout l'objet du masquage.
        #
        # Le demon seul ne rejoint aucun reseau : sans cle d'authentification il
        # tourne et attend. C'est `tailscale up` qui engage la machine, et il
        # n'est automatise nulle part a ce jour — ni dans la politique, ni dans
        # le kickstart.
        - tailscaled.service

  - type: signing

# Variante Surface (Olivier Surface Studio + Pro 7+) : recipe `bf-surface.yml`
# qui layered le kernel linux-surface depuis le repo Copr.
