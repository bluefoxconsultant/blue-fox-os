# Recipe Blue Fox OS - variante Surface (Olivier Surface Studio 2 + Pro 7+).
# Identique a bf.yml mais layered avec le kernel linux-surface depuis Copr
# pour activer le tactile, le pen, les capteurs et le bouton Surface.
#
# Source linux-surface : https://github.com/linux-surface/linux-surface
# COPR : https://copr.fedorainfracloud.org/coprs/linux-surface/linux-surface/
#
# Le kernel-surface du COPR est build avec Provides/Obsoletes qui remplacent
# le kernel stock de Kinoite quand `rpm-ostree install` resout les deps.
# Pas besoin de override-replace explicite pour les versions Fedora 43+.

name: blue-fox-os-bf-surface
description: Blue Fox OS - image BF + kernel linux-surface (Surface Studio/Pro)

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:

  - type: rpm-ostree
    repos:
      - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      # COPR linux-surface : .repo file pin sur Fedora 43 (matches base
      # Kinoite-main actuel). A bumper en lockstep si la base passe a F44+.
      - https://copr.fedorainfracloud.org/coprs/linux-surface/linux-surface/repo/fedora-43/linux-surface-linux-surface-fedora-43.repo
    install:
      - tailscale
      - rclone
      - fuse3
      # Kernel + modules Surface (touch, pen, type cover, sensors, Surface
      # button). kernel-surface Provides: kernel et Obsoletes le stock pour
      # forcer la substitution propre lors du depsolve.
      - kernel-surface
      # iptsd : daemon userspace pour stylet et tactile precis (IPTS Touch).
      - iptsd
      # libwacom-surface : variante avec les definitions Pen / Surface Slim
      # Pen 2. Provides libwacom et Obsoletes le stock.
      - libwacom-surface
      # surface-secureboot : modules signed avec la cle Microsoft Surface
      # pour passer Secure Boot sans desactiver MOK manuellement.
      - surface-secureboot
    remove:
      - firefox
      - firefox-langpacks

  - type: default-flatpaks@v1
    notify: true
    system:
      repo-url: https://flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      install:
        - com.brave.Browser
        - org.mozilla.Thunderbird
        - com.nextcloud.desktopclient.nextcloudclient
        - com.bitwarden.desktop

  - type: files
    files:
      - source: usr
        destination: /usr

  - type: script
    snippets:
      - rpm-ostree install /usr/share/bluefox/rpm-staging/bluefox-welcome.noarch.rpm && rm -rf /usr/share/bluefox/rpm-staging

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer
        - bluefox-rebase.service
        - firstboot.service
        # iptsd doit tourner pour avoir le stylet/touch actifs des le boot.
        - iptsd.service
      masked:
        - tailscaled.service

  - type: signing
