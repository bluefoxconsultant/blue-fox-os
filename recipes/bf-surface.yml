# Recipe Blue Fox OS - variante Surface (Olivier Surface Studio 2 + Pro 7+).
# Identique a bf.yml mais layered avec le kernel linux-surface depuis le
# repo officiel pour activer le tactile, le pen, les capteurs et le bouton
# Surface.
#
# Source : https://github.com/linux-surface/linux-surface
# Repo Fedora : NOTRE .repo, ecrit par files/scripts/setup-surface-repo.sh, et
#   non plus celui servi par pkg.surfacelinux.com — qui porte
#   skip_if_unavailable=1 et une gpgkey sur une branche mutable
#   (audit P5.2 2026-07-22, #23812).
#   Il garde $releasever, donc suit la base Kinoite-main sans bumper.
#
# Le kernel-surface est build avec Provides/Obsoletes qui remplacent le
# kernel stock de Kinoite quand `rpm-ostree install` resout les deps.

name: blue-fox-os-bf-surface
description: Blue Fox OS - image BF + kernel linux-surface (Surface Studio/Pro)

base-image: ghcr.io/ublue-os/kinoite-main
# Pinned to f43 (kinoite tag "43") tant que pkg.surfacelinux.com n'a pas
# publie son tree f44 (404 sur https://pkg.surfacelinux.com/fedora/f44/).
# bf.yml reste sur :latest -- seul ce tenant est touche.
#
# Re-eval BFOSL2 : 2026-05-06 — pin maintenu.
#   - kinoite-main:latest est passe a F44 (kernel 6.19.14-300.fc44, build 44.20260506.1)
#   - kinoite-main:43 actif et maintenu (build 43.20260506.1, kernel 6.19.14-200.fc43)
#   - linux-surface F43 actif : kernel-surface 6.19.8-2.surface.fc43, derniers commits 2026-04-30
#   - linux-surface F44 : repo 404 + issue upstream #2092 ouverte 2026-04-30, pas mergee
# Re-eval 2026-07-24 (#23812) — pin maintenu.
#   - https://pkg.surfacelinux.com/fedora/f44/ repond toujours 404 ; f43 = 200.
#   - Le gate n'a plus de date : il est rattache a #23812, rejoue a chaque
#     passage sur cette recipe. Une date de re-eval echue depuis 7 semaines
#     sans que personne ne la rejoue ne protege rien.
#   - setup-surface-repo.sh nomme desormais ce cas explicitement quand il
#     tombe : le 404 du tree f<N> ressort comme tel, pas en echec de depsolve.
image-version: "43"

modules:

  # Depot linux-surface durci, AVANT le module rpm-ostree qui en depend
  # (#23812). Voir l'entete de files/scripts/setup-surface-repo.sh pour le
  # detail des trois faiblesses du .repo amont.
  - type: script
    snippets:
      # Le module `script` v1 cherche ses `scripts:` sous
      # $CONFIG_DIRECTORY/scripts, or CONFIG_DIRECTORY vaut /tmp/config
      # (config complet monte) OU /tmp/files (seul files/ monte) selon la
      # version de BlueBuild — les deux conventions coexistent encore dans les
      # modules amont, cf. modules/files/files.sh. On resout donc nous-memes,
      # avec les deux racines candidates : elles pointent le meme dossier
      # in-repo, files/scripts/.
      - for D in "${CONFIG_DIRECTORY}/scripts" "${CONFIG_DIRECTORY}/files/scripts"; do [ -f "$D/setup-surface-repo.sh" ] && exec bash "$D/setup-surface-repo.sh"; done; echo "ERREUR - setup-surface-repo.sh introuvable sous ${CONFIG_DIRECTORY}" >&2; exit 1

  - type: rpm-ostree
    repos:
      - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      # ⚠️ PAS d'entree linux-surface ici : son .repo est ecrit par le module
      # `script` ci-dessus. Le module rpm-ostree curl un .repo et enchaine le
      # depsolve dans la meme etape — il n'y a aucun point d'accroche pour en
      # corriger le contenu, d'ou le pre-module.
    install:
      - tailscale
      - rclone
      - fuse3
      # Kernel + modules Surface (touch, pen, type cover, sensors, Surface
      # button). kernel-surface Provides: kernel et Obsoletes le stock pour
      # forcer la substitution propre lors du depsolve.
      - kernel-surface
      # iptsd : daemon userspace pour stylet et tactile precis (IPTS Touch).
      - iptsd
      # surface-secureboot : modules signed avec la cle Microsoft Surface
      # pour passer Secure Boot sans desactiver MOK manuellement.
      - surface-secureboot
      # plymouth-plugin-script : script.so requis par Plymouth theme [#22420]
      - plymouth-plugin-script
      # Note : on n'installe PAS libwacom-surface car il conflicte avec
      # libwacom du stock Fedora qui est plus recent. La calibration pen
      # marche correctement avec libwacom stock + le kernel-surface ; on
      # ajoutera libwacom-surface plus tard via override-replace si pen
      # behavior est off sur le Surface Studio.
    remove:
      - firefox
      - firefox-langpacks

  - type: default-flatpaks@v1
    notify: true
    system:
      repo-url: https://flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      install:
        - com.brave.Browser
        - org.mozilla.Thunderbird
        - com.nextcloud.desktopclient.nextcloudclient
        - com.bitwarden.desktop

  - type: files
    files:
      - source: usr
        destination: /usr
      # KDE theme (kdeglobals + sddm.conf.d + skel) généré par
      # scripts/generate_kde_theme.py à partir de config/bf.json.
      - source: etc
        destination: /etc

  - type: script
    snippets:
      - rpm-ostree install /usr/share/bluefox/rpm-staging/bluefox-welcome.noarch.rpm && rm -rf /usr/share/bluefox/rpm-staging
      # Refresh fontconfig cache pour Lexend hand-baked (cf bf.yml).
      - fc-cache -f /usr/share/fonts/lexend/
      # Les tables MIME de Fedora designent firefox pour http/https/text-html,
      # or la recette le RETIRE de l'image. Un gestionnaire fantome fait
      # descendre xdg-open jusqu'au premier programme revendiquant text/html
      # — un editeur de texte. Vecu le 2026-07-19 (« le bouton ouvre Kate »),
      # et ça cassait aussi le bouton SSO Nextcloud, donc le montage.
      # Notre /etc/xdg/mimeapps.list (Brave) reste seul en place.
      - sed -i "/=org\.mozilla\.firefox\.desktop$/d" /usr/share/applications/mimeapps.list
      # Bake Plymouth theme dans initramfs. `-R` retombe sur `uname -r` =
      # kernel HOTE du build agent, absent de /lib/modules/ de l'image.
      # ⚠️ Et `--regenerate-all` ne suffit pas non plus (corrige 2026-07-19,
      # cf. le bloc de commentaires equivalent dans bf.yml) :
      #   1. il meurt sur « Invalid tmpdir '/var/tmp' » — /var est vide dans
      #      une image bootc a la construction -> --tmpdir /tmp ;
      #   2. il ecrit dans /boot/, qu'ostree ignore : l'initramfs d'une image
      #      ostree vit dans /usr/lib/modules/<kver>/initramfs.img.
      # La boucle couvre les DEUX noyaux de cette variante (Fedora + surface).
      - PLYMOUTH_THEME=$(awk -F= '/^Theme=/{print $2}' /etc/plymouth/plymouthd.conf) && [ -n "$PLYMOUTH_THEME" ] && plymouth-set-default-theme "$PLYMOUTH_THEME" && for KDIR in /usr/lib/modules/*/; do KVER=$(basename "$KDIR"); dracut -f --kver "$KVER" --tmpdir /tmp "${KDIR}initramfs.img" || exit 1; lsinitrd "${KDIR}initramfs.img" | grep -q "plymouth/themes/${PLYMOUTH_THEME}/" || { echo "ERREUR - theme ${PLYMOUTH_THEME} absent de ${KDIR}initramfs.img"; exit 1; }; done
      # Nom de marque dans l'entree de demarrage (cf. bf.yml). ID reste fedora.
      - . /usr/lib/os-release && sed -i "s|^NAME=.*|NAME=\"Blue Fox OS\"|; s|^PRETTY_NAME=.*|PRETTY_NAME=\"Blue Fox OS ${VERSION_ID} (Kinoite)\"|" /usr/lib/os-release

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer
        - bluefox-rebase.service
        - firstboot.service
        - bluefox-tpm-enroll.service   # auto-deverrouillage LUKS TPM2, pilote par la policy
        # iptsd ship une unite templated `iptsd@.service` lancee par udev
        # quand le device IPTS apparait au boot. Pas besoin de l'enable
        # explicitement.
      masked:
        - tailscaled.service

  - type: signing
