# Recipe Blue Fox OS - tenant factice (validation du whitelabel).
# Sert à prouver que le templating fonctionne avant le premier client externe.
# v1.1 remplacera ce factice par un vrai client.

name: blue-fox-os-factice
description: Blue Fox OS - tenant factice (validation whitelabel templating, ne pas distribuer)

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

# Provenance de l'image (#23810) — voir recipes/bf.yml pour le rationale et le
# piege du shellexpand sur variable absente.
labels:
  org.opencontainers.image.revision: "${BF_GIT_REVISION}"
  # ⚠️ `source` aussi : BlueBuild le derive de la CI et le laisse VIDE en
  # local (cf. recipes/bf.yml). Une revision sans depot ne designe rien.
  org.opencontainers.image.source: "https://github.com/bluefoxconsultant/blue-fox-os"

modules:

  - type: rpm-ostree
    repos:
      - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      - tailscale
      - rclone           # P4.1 : rclone mount NC via systemd --user (BFOSP3)
      - fuse3            # rclone mount needs fusermount3
      - plymouth-plugin-script   # script.so requis par Plymouth theme [#22420]
    remove:
      - firefox
      - firefox-langpacks
    # Lexend : ship via files module (pas de paquet Fedora).

  - type: default-flatpaks@v1
    notify: true
    system:
      repo-url: https://flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      install:
        - com.brave.Browser
        - org.mozilla.Thunderbird
        - com.nextcloud.desktopclient.nextcloudclient
        - com.bitwarden.desktop   # P4.1 : pre-seed Vaultwarden URL

  - type: files
    files:
      - source: usr
        destination: /usr
      # /etc/xdg/kdeglobals + /etc/sddm.conf.d + /etc/skel matérialisés par
      # scripts/generate_kde_theme.py à partir de config/factice.json.
      - source: etc
        destination: /etc
      # Branding factice : palette mauve, logo générique, wallpaper test.
      # Sert uniquement à valider que le pipeline matrix produit bien des
      # images visuellement distinctes.

  # Installe le RPM bluefox-welcome stage par la CI (cf. recipes/bf.yml).
  - type: script
    snippets:
      # bluefox-welcome : signature verifiee avant installation (#23811) — cf.
      # recipes/bf.yml pour le rationale et la resolution a deux racines.
      - for D in "${CONFIG_DIRECTORY}/scripts" "${CONFIG_DIRECTORY}/files/scripts"; do [ -f "$D/install-welcome-rpm.sh" ] && exec bash "$D/install-welcome-rpm.sh"; done; echo "ERREUR - install-welcome-rpm.sh introuvable sous ${CONFIG_DIRECTORY}" >&2; exit 1
      # Refresh fontconfig cache pour Lexend hand-baked (cf bf.yml).
      - fc-cache -f /usr/share/fonts/lexend/
      # Les tables MIME de Fedora designent firefox pour http/https/text-html,
      # or la recette le RETIRE de l'image. Un gestionnaire fantome fait
      # descendre xdg-open jusqu'au premier programme revendiquant text/html
      # — un editeur de texte. Vecu le 2026-07-19 (« le bouton ouvre Kate »),
      # et ça cassait aussi le bouton SSO Nextcloud, donc le montage.
      # Notre /etc/xdg/mimeapps.list (Brave) reste seul en place.
      - sed -i "/=org\.mozilla\.firefox\.desktop$/d" /usr/share/applications/mimeapps.list
      # Bake Plymouth theme dans initramfs (cf bf.yml).
      # ⚠️ `-R` retombe sur `uname -r` = kernel de l'hote de build, absent de
      # l'image -> dracut FAIL. Meme correctif que bf.yml (2026-07-19) :
      # --tmpdir /tmp (/var vide en image bootc) + cible explicite dans
      # /usr/lib/modules/<kver>/, qu'ostree lit reellement.
      - PLYMOUTH_THEME=$(awk -F= '/^Theme=/{print $2}' /etc/plymouth/plymouthd.conf) && [ -n "$PLYMOUTH_THEME" ] && plymouth-set-default-theme "$PLYMOUTH_THEME" && for KDIR in /usr/lib/modules/*/; do KVER=$(basename "$KDIR"); dracut -f --kver "$KVER" --tmpdir /tmp "${KDIR}initramfs.img" || exit 1; lsinitrd "${KDIR}initramfs.img" | grep -q "plymouth/themes/${PLYMOUTH_THEME}/" || { echo "ERREUR - theme ${PLYMOUTH_THEME} absent de ${KDIR}initramfs.img"; exit 1; }; done

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer
        - firstboot.service        # P4.1 : welcome wizard au premier boot
      masked:
        - tailscaled.service

  - type: signing
